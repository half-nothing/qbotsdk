name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to attach the artifacts to, for example v0.5.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      - name: Sync dependencies
        run: pdm install -d --frozen-lockfile

      - name: Lint code
        run: pdm run ruff check

      - name: Type check
        run: pdm run mypy

      - name: Run tests
        run: pdm run pytest -q

      - name: Build sdist and wheel
        run: pdm build

      - name: Inspect the artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, got {wheels} {sdists}")

          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()

          if not any(name.endswith("qqbot/py.typed") for name in names):
              raise SystemExit("py.typed is missing from the wheel")
          if any(name.startswith("tests/") or name.startswith("docs/") for name in names):
              raise SystemExit("tests or docs leaked into the wheel")
          print(f"{wheels[0].name}: {len(names)} files, {sdists[0].name}")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*
