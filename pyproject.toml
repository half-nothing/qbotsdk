[project]
name = "qbotsdk"
version = "0.6.0"
description = "Async SDK for the QQ bot open platform"
keywords = ["qq", "qqbot", "bot", "sdk", "websocket", "webhook", "asyncio"]
authors = [
    { name = "Half_nothing", email = "Half_nothing@163.com" },
]
maintainers = [
    { name = "Half_nothing", email = "Half_nothing@163.com" },
]
dependencies = [
    "aiohttp>=3.14.3",
    "pydantic>=2.13.4",
    "yarl>=1.24.5",
    "loguru>=0.7.3",
    "cryptography>=50.0.2",
    "async-event-bus>=1.0.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/half-nothing/qbotsdk"
Repository = "https://github.com/half-nothing/qbotsdk"
Issues = "https://github.com/half-nothing/qbotsdk/issues"
Changelog = "https://github.com/half-nothing/qbotsdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=8.1.0"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
# 源码包里带上更新日志; source-includes 只影响 sdist, 不会跑进 wheel
source-includes = ["CHANGELOG.md"]

[tool.mypy]
python_version = "3.12"
disable_error_code = []
strict = true
disallow_untyped_defs = true
warn_return_any = true
files = [
    "src/",
    "tests/"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "TID", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
# 只允许同包内的相对导入; 跨子包一律写全路径
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "pytest-asyncio>=1.4.1",
    "redis>=8.1.0",
]
