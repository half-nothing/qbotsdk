[project]
name = "qbotsdk"
version = "1.0.0"
description = "Async SDK for the QQ bot open platform"
keywords = ["qq", "qqbot", "bot", "sdk", "websocket", "webhook", "asyncio"]
authors = [
    { name = "Half_nothing", email = "Half_nothing@163.com" },
]
maintainers = [
    { name = "Half_nothing", email = "Half_nothing@163.com" },
]
dependencies = [
    "aiohttp>=3.14.5",
    "pydantic>=2.14.3",
    "yarl>=1.25.1",
    "loguru>=0.7.3",
    "cryptography>=50.0.2",
    "async-event-bus>=1.0.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/half-nothing/qbotsdk"
Repository = "https://github.com/half-nothing/qbotsdk"
Issues = "https://github.com/half-nothing/qbotsdk/issues"
Changelog = "https://github.com/half-nothing/qbotsdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=8.1.0"]
sqlite = ["sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20"]
mysql = ["sqlalchemy[asyncio]>=2.0", "asyncmy>=0.2.9"]
postgres = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
source-includes = ["CHANGELOG.md"]

[tool.pdm.scripts]
lint = "ruff check ."
format = "ruff format --check ."
types = "pyrefly check"
test = "pytest -q"
check = { composite = [
    "lint",
    "format",
    "types",
    "test",
] }

[tool.pyrefly]
project-includes = ["src/", "tests/"]
search-path = ["src", "."]
python-version = "3.12.0"
preset = "strict"
check-unannotated-defs = true
infer-return-types = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "TID", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
# 只允许同包内的相对导入
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "pytest-asyncio>=1.4.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]
